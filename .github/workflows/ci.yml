name: CI

# Typecheck, lint, and test on every pull request, plus pushes to main.
#
# No DATABASE_URL and no secrets are provided to this workflow, and that is
# deliberate: it proves the code typechecks and the unit tests pass without any
# credential. Anything needing a live database belongs in the eval harness, not
# in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # A public repository with a live Neon password in .env.local is one
      # mistake away from disaster, so CI checks the tracked tree independently.
      - name: Assert no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env.local 2>/dev/null; then
            echo "::error::.env.local is tracked in git. It holds a live database password."
            exit 1
          fi
          tracked=$(git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Unexpected tracked env file(s): $tracked"
            exit 1
          fi
          echo "OK — only .env.example is tracked."
